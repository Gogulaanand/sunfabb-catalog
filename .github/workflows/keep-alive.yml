name: Production Synthetic Checks

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-synthetic-checks
  cancel-in-progress: false

jobs:
  probe:
    name: Probe critical routes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://sunfabb.com' }}
      BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL || 'https://sunfabb-backend.onrender.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe production
        run: bash tools/production-monitor.sh
