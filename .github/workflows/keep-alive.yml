name: Render Keep-Alive

# This workflow remains manually disabled in GitHub until the owner chooses to
# resume Render wake-up traffic.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Probe backend liveness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL || 'https://sunfabb-backend.onrender.com' }}
    steps:
      - name: Probe process liveness
        run: |
          set -euo pipefail

          backend_url="${BACKEND_URL%/}"
          if [[ ! "$backend_url" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error title=Invalid keep-alive configuration::BACKEND_URL must be an absolute HTTP(S) URL"
            exit 2
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 35 \
            --output /dev/null \
            --user-agent "sunfabb-render-keep-alive/1.0" \
            --write-out 'GET /live -> HTTP %{http_code} in %{time_total}s\n' \
            "${backend_url}/live"
